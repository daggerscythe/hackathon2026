<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slaying Goliath</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Physics plugin -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.4/dist/aframe-physics-system.min.js"></script>

  <script src="game/game.js"></script>
  <script src="game/physics.js"></script>
  <script src="game/network.js"></script>
  <script src="game/spectator.js"></script>
  <script src="UI/menu.js"></script>
  <script src="game/ui.js"></script>
  <script src="game/audio.js"></script>
  <style>
    /* Health bar styles — float above canvas */
    .health-bar-container {
      position: absolute;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -100%);
    }

    .player-nickname {
      color: white;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 4px #000, 0 0 8px #000;
      margin-bottom: 3px;
      white-space: nowrap;
    }

    .health-bar-bg {
      width: 60px;
      height: 6px;
      background: #333;
      border: 1px solid #000;
      border-radius: 2px;
      overflow: hidden;
    }

    .health-bar-fill {
      height: 100%;
      background: #2ecc71;
      transition: width 0.2s, background 0.2s;
      border-radius: 2px;
    }
  </style>

  <script>
    const CLASS_MODEL = {
      // villain
      villain_mage: 'model-villain-mage',
      brute:        'model-brute',
      agile:        'model-agile',
      // hero
      mage:         'model-hero-mage',
      support:      'model-support',
      dps:          'model-dps',
      tank:         'model-tank',
    };
    // ============================================
    // BILLBOARD HEALTH BAR COMPONENT
    // Projects a world position to screen space
    // and places an HTML health bar there
    // ============================================
    AFRAME.registerComponent('health-bar', {
      schema: {
        nickname: { type: 'string', default: 'Player' },
        health:   { type: 'number', default: 100 },
        maxHealth:{ type: 'number', default: 100 },
      },

      init() {
        // create the HTML overlay element
        this.container = document.createElement('div');
        this.container.className = 'health-bar-container';
        this.container.innerHTML = `
          <div class="player-nickname">${this.data.nickname}</div>
          <div class="health-bar-bg">
            <div class="health-bar-fill" style="width:100%"></div>
          </div>
        `;
        document.body.appendChild(this.container);

        this.fill     = this.container.querySelector('.health-bar-fill');
        this.nameEl   = this.container.querySelector('.player-nickname');
        this.camera   = null;
        this.renderer = null;

        // listen for health changes from game.js
        const id = this.el.dataset.characterId || this.el.getAttribute('id');
        this.characterId = id;
        this.onHealthChanged = (e) => {
            if (e.detail.characterId !== this.characterId) return;
            this.updateHealth(e.detail.health, e.detail.maxHealth);
        };

        this.onDefeated = (e) => {
          if (e.detail.characterId !== this.characterId) return;
          this.container.style.display = 'none';
        };
        document.addEventListener('game:healthChanged',      this.onHealthChanged);
        document.addEventListener('game:characterDefeated',  this.onDefeated);

      },

      // call this from game.js when health changes
      updateHealth(health, maxHealth) {
        const pct = Math.max(0, (health / maxHealth) * 100);
        this.fill.style.width = `${pct}%`;

        // color shifts green → yellow → red
        if (pct > 60)      this.fill.style.background = '#2ecc71';
        else if (pct > 30) this.fill.style.background = '#f39c12';
        else               this.fill.style.background = '#e74c3c';
      },

      tick() {
        // lazy-grab camera and renderer once scene is ready
        if (!this.camera) {
          const camEl = document.getElementById('main-camera');
          if (!camEl || !camEl.object3D) return;
          this.camera   = camEl.object3D;
          this.renderer = this.el.sceneEl.renderer;
        }

        // world position — place bar above the entity's head
        const worldPos = new THREE.Vector3();
        this.el.object3D.getWorldPosition(worldPos);
        worldPos.y += 2.4; // float above head

        // project to screen space
        const canvas   = this.renderer.domElement;
        const projected = worldPos.clone().project(
          this.el.sceneEl.camera
        );

        const x = (projected.x * 0.5 + 0.5) * canvas.clientWidth;
        const y = (1 - (projected.y * 0.5 + 0.5)) * canvas.clientHeight;

        // hide if behind camera
        if (projected.z > 1) {
          this.container.style.display = 'none';
          return;
        }

        this.container.style.display = 'flex';
        this.container.style.left    = `${x}px`;
        this.container.style.top     = `${y}px`;
      },

      remove() {
        document.removeEventListener('game:healthChanged',     this.onHealthChanged);
        document.removeEventListener('game:characterDefeated', this.onDefeated);
        if (this.container && this.container.parentNode) {
            this.container.parentNode.removeChild(this.container);
        }
      },
    });


    // ============================================
    // INITIALIZE LOBBY
    // ============================================
    function initMatchFromLobby() {
      const scene        = document.querySelector('a-scene');
      const lobbyPlayers = JSON.parse(sessionStorage.getItem('lobbyPlayers') || '[]');
      const myClientId   = sessionStorage.getItem('clientId');
      const myClass      = sessionStorage.getItem('selectedClass') || 'brute';
      const myRole       = sessionStorage.getItem('selectedRole')  || 'villain';
      const myName       = sessionStorage.getItem('selectedCharacter') || 'You';

      console.log('[LOBBY] My role:', myRole, '| My class:', myClass, '| My name:', myName, '| My clientId:', myClientId);

      // find my own spawn position from lobby data
      const myLobbyEntry = lobbyPlayers.find(p => p.clientId === myClientId);
      const mySpawnX     = myLobbyEntry?.spawnX ?? 0;
      const mySpawnY     = myLobbyEntry?.spawnY ?? 3;
      const mySpawnZ     = myLobbyEntry?.spawnZ ?? 0;

      console.log(`[SPAWN] My spawn: x:${mySpawnX} y:${mySpawnY} z:${mySpawnZ}`);

      // move local player to their spawn position
      const localPlayerEl = document.getElementById('player-villain');
      if (localPlayerEl) {
        localPlayerEl.setAttribute('position', `${mySpawnX} ${mySpawnY} ${mySpawnZ}`);

        // wait for physics body to be ready before repositioning
        const applySpawn = () => {
          const body = localPlayerEl.components['dynamic-body']?.body;
          if (!body) {
            setTimeout(applySpawn, 100);
            return;
          }
          console.log('[SPAWN] Physics body ready, applying spawn position');
          body.position.set(mySpawnX, mySpawnY, mySpawnZ);
          body.velocity.set(0, 0, 0);
        };

        localPlayerEl.addEventListener('body-loaded', applySpawn, { once: true });
        // fallback in case body-loaded already fired
        setTimeout(applySpawn, 500);
      }

      // register local player
      const localCharId = myRole === 'villain' ? 'villain' : MY_ID;
      addCharacter(localCharId, myRole, myClass, {
        name: myName,
        strength: 80, magic: 75, defense: 60, speed: 50, power: 20,
      }, 'player-villain');

      // update local player model and attack-input to match chosen class
      const localModel = document.getElementById('villain-model');
      if (localModel) {
        const modelSrc = `#${CLASS_MODEL[myClass] || 'model-brute'}`;
        console.log('[MODEL] Setting local model to:', modelSrc);
        localModel.setAttribute('src', modelSrc);
      }
      if (localPlayerEl) {
        localPlayerEl.setAttribute('attack-input', 
          `characterId: ${localCharId}; attackClass: ${myClass}`);
        localPlayerEl.setAttribute('melee-hitbox',
          `characterId: ${localCharId}; duration: 300`);
        localPlayerEl.dataset.characterId = localCharId;
      }
      
      const villainId = myRole === 'villain' ? 'villain' : null;
      const heroIds   = [...characters.keys()].filter(id => {
        const c = characters.get(id);
        return c && c.role === 'hero';
      });

      // find actual villain id
      const actualVillainId = [...characters.keys()].find(id => {
        const c = characters.get(id);
        return c && c.role === 'villain';
      });

      console.log('[LOBBY] Starting match — villain:', actualVillainId, '| heroes:', heroIds);
      if (actualVillainId) initMatch(actualVillainId, heroIds);
      else transitionTo(STATES.BATTLE);
    }
    // wait for scene to fully load before spawning// wait for scene to fully load before spawning
    document.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      if (scene.hasLoaded) {
        initMatchFromLobby();
      } else {
        scene.addEventListener('loaded', initMatchFromLobby);
      }
    });
  </script>

</head>
<body>

    <!-- A-Frame Scene -->
    <a-scene
      id="main-scene"
      renderer="antialias: true"
      shadow="type: pcfsoft"
      physics="gravity: -9.8; debug: true"
      game-manager
      network-lerp
    >

    <!-- Assets -->
    <a-assets timeout="10000">
      <img id="sky"       src="assets/textures/sky.jpg"/>
      <img id="sky_night" src="assets/textures/sky_night.jpg"/>
      <!-- villain classes -->
      <a-asset-item id="model-villain-mage" src="assets/models/villain_mage.glb"></a-asset-item>
      <a-asset-item id="model-brute"        src="assets/models/brute.glb"></a-asset-item>
      <a-asset-item id="model-agile"        src="assets/models/agile.glb"></a-asset-item>

      <!-- hero classes -->
      <a-asset-item id="model-hero-mage"    src="assets/models/hero_mage.glb"></a-asset-item>
      <a-asset-item id="model-support"      src="assets/models/support.glb"></a-asset-item>
      <a-asset-item id="model-dps"          src="assets/models/dps.glb"></a-asset-item>
      <a-asset-item id="model-tank"         src="assets/models/tank.glb"></a-asset-item><a-asset-item id="sword"    src="assets/models/sword.glb"></a-asset-item>
      <a-asset-item id="fireball" src="assets/models/fireball.glb"></a-asset-item>
      <a-asset-item id="arena" src="assets/models/arena.glb"></a-asset-item>
    </a-assets>

    <a-sky src="#sky_night"></a-sky>

    <!-- Stage / Map -->
    <a-entity id="stage">
      <a-gltf-model
        src="#arena"
        position="0 -0.3 0"
        scale="1"
      ></a-gltf-model>

      <!-- keep the platform for now -->
      <a-box
        id="platform"
        position="0 2.3 0"
        width="30" height="0.2" depth="30"
        visible="false"
        static-body="shape: box"
      ></a-box>
    </a-entity>


    <!-- Lighting -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.1"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.5" position="5 10 5" shadow="cast: true"></a-entity>


    <!-- Local player — villain, controlled by physics -->
    <a-entity
      id="player-villain"
      class="player"
      data-role="villain"
      data-character-id="villain"
      position="0 2 0"
      dynamic-body="mass: 5; linearDamping: 0.99; angularDamping: 1.0"
      player-physics
      attack-input="characterId: villain; attackClass: brute"
      melee-hitbox="characterId: villain; duration: 300"
      health-bar="nickname: You; health: 100; maxHealth: 100"
    >
      <a-gltf-model
        id="villain-model"
        src="#model-brute"
        scale="0.8 0.8 0.8"
        position="0 0 0"
        visible="false"
      ></a-gltf-model>
      <a-camera
        id="main-camera"
        position="0 2 -0.2"
        look-controls="pointerLockEnabled: true"
        wasd-controls="enabled: false"
      ></a-camera>
    </a-entity>
    
  </a-scene>

</body>

<!-- TEMP TIMER — move to ui.js later  -->
<div id="round-timer" style="
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 28px;
  font-family: 'Courier New', monospace;
  text-shadow: 0 0 8px #000;
  z-index: 999;
  pointer-events: none;
">3:00</div>

<!-- SPECTATE OVERLAY -->
<div id="spectate-overlay" style="
  display: none;
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 18px;
  font-family: 'Courier New', monospace;
  text-shadow: 0 0 8px #000;
  z-index: 999;
  pointer-events: none;
  text-align: center;
">
  <div id="spectate-text">Spectating: —</div>
  <div style="font-size:12px; opacity:0.6; margin-top:4px">[ N ] next player</div>
</div>

<script>
  // TEMP — move to ui.js later
  let timeLeft = 180; // 3 minutes in seconds
  const timerEl = document.getElementById('round-timer');

  function startRoundTimer() {
    const interval = setInterval(() => {
      timeLeft--;

      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      timerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

      // turn red in last 30 seconds
      timerEl.style.color = timeLeft <= 30 ? '#e74c3c' : 'white';

      if (timeLeft <= 0) {
        clearInterval(interval);
        timerEl.textContent = '0:00';
        // time's up — villain loses if heroes still alive
        if (typeof endMatch === 'function' && getState() === STATES.BATTLE) {
          endMatch('hero');
        }
      }
    }, 1000);
  }

  // start timer when match starts
  // document.addEventListener('DOMContentLoaded', () => {
  //   document.addEventListener('game:matchStarted', () => startRoundTimer());
  // });
  window.addEventListener('DOMContentLoaded', () => startRoundTimer());
</script>

</html>
