<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battle Arena</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="/game.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }

    /* ── HUD overlay ──────────────────────────────────────────────── */
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      z-index: 10; font-family: 'Segoe UI', sans-serif;
    }

    /* Health bars */
    #hud-health {
      position: absolute; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 32px; align-items: flex-end;
    }
    .hud-bar-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .hud-bar-name {
      font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }
    .hud-bar-bg {
      width: 160px; height: 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .hud-bar-fill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #c9a84c, #e8d090);
      transition: width 0.3s;
    }
    .hud-bar-fill.villain { background: linear-gradient(90deg, #e74c3c, #ff6b6b); }

    /* Status message */
    #hud-status {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      font-size: 0.7rem; letter-spacing: 5px; text-transform: uppercase;
      color: rgba(201,168,76,0.8);
      text-shadow: 0 0 20px rgba(201,168,76,0.5);
    }

    /* Connection status */
    #conn-status {
      position: absolute; top: 20px; right: 20px;
      font-size: 0.55rem; letter-spacing: 3px; text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }
    #conn-status.ok   { color: rgba(93,232,93,0.7); }
    #conn-status.err  { color: rgba(232,112,112,0.7); }

    /* Loading screen */
    #loading-screen {
      position: fixed; inset: 0; background: #04060c;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; z-index: 100;
    }
    #loading-screen.hidden { display: none; }
    .loading-title {
      font-family: serif; font-size: 1.2rem; letter-spacing: 8px;
      text-transform: uppercase; color: #c9a84c;
    }
    .loading-sub {
      font-size: 0.6rem; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>

  <!-- ── Loading screen ──────────────────────────────────────────────── -->
  <div id="loading-screen">
    <div class="loading-title">Entering the Arena</div>
    <div class="loading-sub" id="loading-msg">Connecting to server…</div>
  </div>

  <!-- ── HUD ─────────────────────────────────────────────────────────── -->
  <div id="hud">
    <div id="hud-status">Waiting for battle to begin…</div>
    <div id="conn-status">●  Connecting</div>
    <div id="hud-health"></div>
  </div>

  <!-- ── A-Frame Scene ────────────────────────────────────────────────── -->
  <a-scene
    id="main-scene"
    game-manager
    background="color: #04060c"
    fog="type: linear; color: #04060c; near: 20; far: 60"
    renderer="antialias: true; colorManagement: true"
  >

    <!-- Assets -->
    <a-assets>
      <a-mixin id="hero-look"
        geometry="primitive: capsule; radius: 0.4; height: 1.8"
        material="color: #c9a84c; roughness: 0.6"></a-mixin>
      <a-mixin id="villain-look"
        geometry="primitive: capsule; radius: 0.4; height: 1.8"
        material="color: #8b1a1a; roughness: 0.6"></a-mixin>
    </a-assets>

    <!-- ── Lighting ──────────────────────────────────────────────────── -->
    <a-light type="ambient"      color="#222233" intensity="0.8"></a-light>
    <a-light type="directional"  color="#fff8e8" intensity="1.2"
             position="5 12 -4"></a-light>
    <a-light type="point"        color="#c9a84c" intensity="0.4"
             position="0 6 0" distance="30"></a-light>

    <!-- ── Arena floor ───────────────────────────────────────────────── -->
    <a-plane
      rotation="-90 0 0"
      width="40" height="40"
      material="color: #0a0d1a; roughness: 0.9; metalness: 0.1"
      shadow="receive: true">
    </a-plane>

    <!-- Arena grid lines -->
    <a-entity position="0 0.01 0">
      <!-- outer boundary wall markers -->
      <a-box width="40" height="0.05" depth="0.1"  position="0 0  20"  color="#c9a84c" opacity="0.2"></a-box>
      <a-box width="40" height="0.05" depth="0.1"  position="0 0 -20"  color="#c9a84c" opacity="0.2"></a-box>
      <a-box width="0.1" height="0.05" depth="40"  position=" 20 0 0"  color="#c9a84c" opacity="0.2"></a-box>
      <a-box width="0.1" height="0.05" depth="40"  position="-20 0 0"  color="#c9a84c" opacity="0.2"></a-box>
      <!-- center divider line -->
      <a-box width="40" height="0.04" depth="0.06" position="0 0 0"    color="#c9a84c" opacity="0.15"></a-box>
    </a-entity>

    <!-- Atmospheric pillars -->
    <a-cylinder radius="0.3" height="8" position=" 8 4  8" color="#0d1020" opacity="0.9" segments-radial="6"></a-cylinder>
    <a-cylinder radius="0.3" height="8" position="-8 4  8" color="#0d1020" opacity="0.9" segments-radial="6"></a-cylinder>
    <a-cylinder radius="0.3" height="8" position=" 8 4 -8" color="#0d1020" opacity="0.9" segments-radial="6"></a-cylinder>
    <a-cylinder radius="0.3" height="8" position="-8 4 -8" color="#0d1020" opacity="0.9" segments-radial="6"></a-cylinder>

    <!-- Pillar top glows -->
    <a-sphere radius="0.25" position=" 8 8.2  8" color="#c9a84c" material="emissive: #c9a84c; emissiveIntensity: 0.6"></a-sphere>
    <a-sphere radius="0.25" position="-8 8.2  8" color="#c9a84c" material="emissive: #c9a84c; emissiveIntensity: 0.6"></a-sphere>
    <a-sphere radius="0.25" position=" 8 8.2 -8" color="#c9a84c" material="emissive: #c9a84c; emissiveIntensity: 0.6"></a-sphere>
    <a-sphere radius="0.25" position="-8 8.2 -8" color="#c9a84c" material="emissive: #c9a84c; emissiveIntensity: 0.6"></a-sphere>

    <!-- ── Player entities (populated by JS on roster) ───────────────── -->
    <!-- Dynamically injected: id="player-{clientId}" -->

    <!-- ── Camera rig (follows local player) ─────────────────────────── -->
    <a-entity id="camera-rig" camera-follow="targetId: ">
      <a-entity id="main-camera" camera look-controls
                position="0 5 10">
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    // ── Retrieve lobby state from sessionStorage ──────────────────────
    // pinCode.html stores these before redirecting
    const MY_USERNAME   = sessionStorage.getItem('lobbyUsername')   || 'Adventurer';
    const MY_CHARACTER  = sessionStorage.getItem('lobbyCharacter')  || 'Hero'; // 'Hero' | 'Villain'
    const MY_GAME_ID    = sessionStorage.getItem('lobbyGameId')     || '';
    const WS_HOST       = sessionStorage.getItem('lobbyWsHost')     || 'localhost';

    // ── WS connection ─────────────────────────────────────────────────
    let ws       = null;
    let myId     = null;   // our clientId from the server

    // color map matching server
    const PLAYER_COLORS = {
      hero:    '#c9a84c',
      villain: '#e74c3c',
    };

    function setLoading(msg) {
      document.getElementById('loading-msg').textContent = msg;
    }

    function setStatus(text, cls) {
      const el = document.getElementById('conn-status');
      el.textContent = '●  ' + text;
      el.className = cls || '';
    }

    function connectWS() {
      ws = new WebSocket(`ws://${WS_HOST}:9090`);

      ws.onopen = () => {
        setStatus('Connected', 'ok');
        setLoading('Waiting for roster…');
      };

      ws.onmessage = e => {
        const msg = JSON.parse(e.data);
        handleMessage(msg);
      };

      ws.onerror = () => {
        setStatus('Connection failed', 'err');
        setLoading('Could not reach server.');
      };

      ws.onclose = () => setStatus('Disconnected', 'err');
    }

    function sendWS(payload) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
      }
    }

    // ── Message handler ───────────────────────────────────────────────
    function handleMessage(msg) {
      switch (msg.method) {

        // Server sends our clientId
        case 'connect':
          myId = msg.clientId;
          setLoading('Announcing arrival…');
          // Tell server we're in the game world and ready for the roster
          sendWS({ method: 'game_ready', gameId: MY_GAME_ID });
          break;

        // Server sends the full player list
        case 'roster':
          setLoading('Spawning characters…');
          spawnPlayers(msg.players);
          hideLoading();
          break;

        // Health update from game logic
        case 'health':
          updateHealthBar(msg.characterId, msg.health, msg.maxHealth);
          break;

        // Another player moved
        case 'move':
          syncRemotePosition(msg.id, msg.x, msg.y, msg.z);
          break;

        // Match started
        case 'battle_start':
          document.getElementById('hud-status').textContent = 'Battle!';
          break;
      }
    }

    // ── Spawn all players into the A-Frame scene ──────────────────────
    function spawnPlayers(players) {
      const scene = document.querySelector('a-scene');

      players.forEach((p, i) => {
        const isHero    = p.character === 'Hero';
        const isLocal   = p.isLocal;

        // Spawn positions: Hero starts at z=+8, Villain at z=-8
        // Offset slightly if multiple heroes/villains
        const baseZ   = isHero ? 8 : -8;
        const offsetX = (i % 2 === 0 ? -1 : 1) * (Math.floor(i / 2) * 2);
        const spawnX  = offsetX;
        const spawnZ  = baseZ;

        // Create the character entity
        const entity = document.createElement('a-entity');
        entity.id = `player-${p.id}`;
        entity.setAttribute('position', `${spawnX} 0.9 ${spawnZ}`);

        // Body — capsule shape
        const body = document.createElement('a-capsule');
        body.setAttribute('radius',  '0.4');
        body.setAttribute('height',  '1.8');
        body.setAttribute('color',   isHero ? '#c9a84c' : '#8b1a1a');
        body.setAttribute('roughness', '0.6');
        body.setAttribute('shadow', 'cast: true; receive: false');
        entity.appendChild(body);

        // Floating nametag
        const tagColor = isHero ? '#c9a84c' : '#e87070';
        entity.setAttribute('name-tag', `label: ${p.username}; color: ${tagColor}; yOffset: 1.6`);

        // Attach player-controller only for local player
        if (isLocal) {
          entity.setAttribute('player-controller',
            `characterId: ${p.id}; isLocal: true`);

          // Point camera rig at this entity
          document.getElementById('camera-rig').setAttribute(
            'camera-follow', `targetId: player-${p.id}`
          );
        } else {
          entity.setAttribute('player-controller',
            `characterId: ${p.id}; isLocal: false`);
        }

        scene.appendChild(entity);

        // Register character in game.js
        addCharacter(
          p.id,
          isHero ? 'hero' : 'villain',
          isHero ? 'dps' : 'brute',   // default class — swap once class selection feeds through
          {
            name:      p.username,
            strength:  60,
            magic:     40,
            defense:   40,
            speed:     60,
            power:     30,
          },
          `player-${p.id}`
        );

        // Build health bar for this player
        addHealthBar(p.id, p.username, isHero ? 'hero' : 'villain');
      });

      // If we have 2 players, kick off the match
      const playerIds = players.map(p => p.id);
      const villainIds = players.filter(p => p.character === 'Villain').map(p => p.id);
      const heroIds    = players.filter(p => p.character === 'Hero').map(p => p.id);

      if (villainIds.length > 0 && heroIds.length > 0) {
        initMatch(villainIds[0], heroIds);
        document.getElementById('hud-status').textContent = 'Battle!';
      }
    }

    // ── Health bar HUD ────────────────────────────────────────────────
    function addHealthBar(id, name, role) {
      const container = document.getElementById('hud-health');
      const wrap = document.createElement('div');
      wrap.className = 'hud-bar-wrap';
      wrap.id = `hbar-${id}`;
      wrap.innerHTML = `
        <div class="hud-bar-name">${name}</div>
        <div class="hud-bar-bg">
          <div class="hud-bar-fill ${role === 'villain' ? 'villain' : ''}" id="hfill-${id}" style="width:100%"></div>
        </div>
      `;
      container.appendChild(wrap);
    }

    function updateHealthBar(id, health, maxHealth) {
      const fill = document.getElementById(`hfill-${id}`);
      if (fill) fill.style.width = `${(health / maxHealth) * 100}%`;
    }

    // ── Subscribe to health events from game.js ───────────────────────
    onHealthChanged(({ characterId, health, maxHealth }) => {
      updateHealthBar(characterId, health, maxHealth);
    });

    onMatchOver(({ winner }) => {
      const msg = winner === 'hero' ? '⚔ Heroes Triumph!' : '💀 Villain Victorious!';
      document.getElementById('hud-status').textContent = msg;
      setTimeout(() => { window.location.href = 'UI/menu.html'; }, 4000);
    });

    // ── Hide loading screen ───────────────────────────────────────────
    function hideLoading() {
      document.getElementById('loading-screen').classList.add('hidden');
    }

    // ── Start ─────────────────────────────────────────────────────────
    connectWS();
  </script>
</body>
</html>
