<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Game Logic Test</title>
</head>
<body>
  <h2>Open the console (F12) to see test results</h2>

  <!-- A-Frame is needed because game.js references AFRAME at the bottom -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="game/game.js"></script>

  <script>
    // =====================
    // MOCK DATA
    // =====================
    const mockHero = {
      name: 'Test Hero',
      strength: 70,
      magic: 60,
      defense: 50,
      speed: 80,
      power: 40,
    };

    const mockVillain = {
      name: 'Test Villain',
      strength: 80,
      magic: 75,
      defense: 60,
      speed: 50,
      power: 20,
    };

    // mock character pools so pickRandomCharacter works
    populateCharacterPools({
      hero:    { tank: [mockHero], dps: [mockHero], support: [mockHero], mage: [mockHero] },
      villain: { brute: [mockVillain], agile: [mockVillain], mage: [mockVillain] },
    });

    // =====================
    // TEST 1 — addCharacter
    // =====================
    console.group('TEST 1 — addCharacter');
    const villain = addCharacter('villain', 'villain', 'brute',   mockVillain, 'player-villain');
    const hero1   = addCharacter('hero-1',  'hero',    'tank',    mockHero,    'player-hero-1');
    const hero2   = addCharacter('hero-2',  'hero',    'dps',     mockHero,    'player-hero-2');
    const hero3   = addCharacter('hero-3',  'hero',    'support', mockHero,    'player-hero-3');
    console.assert(villain.health === 100,      'villain starts at 100 HP');
    console.assert(hero1.strength === 0.70,     'hero1 strength is 0.70');
    console.assert(villain.defense === 0.60,    'villain defense is 0.60');
    console.assert(hero1.isAlive === true,      'hero1 starts alive');
    console.groupEnd();

    // =====================
    // TEST 2 — calcDamage
    // =====================
    console.group('TEST 2 — calcDamage');
    const dmg = calcDamage(hero1, villain, 'strength');
    // expected: BASE_DAMAGE(10) * 0.70 * (1 - 0.60) = 10 * 0.70 * 0.40 = 2.8
    console.log('Damage dealt:', dmg);
    console.assert(Math.abs(dmg - 2.8) < 0.01, `expected 2.8, got ${dmg}`);
    console.groupEnd();

    // =====================
    // TEST 3 — applyHit & health update
    // =====================
    console.group('TEST 3 — applyHit');
    applyHit('hero-1', 'villain', 'strength');
    console.log('Villain HP after hit:', villain.health);
    console.assert(villain.health < 100, 'villain took damage');
    console.groupEnd();

    // =====================
    // TEST 4 — villain health on kill
    // =====================
    console.group('TEST 4 — villain health on hero kill');
    const villainHpBefore = villain.health;
    handleDeath('hero-1');
    console.log('Villain HP before kill:', villainHpBefore);
    console.log('Villain HP after kill: ', villain.health);
    console.assert(villain.health === Math.min(villain.maxHealth, villainHpBefore + 50), 'villain gained 50 HP');
    console.assert(hero1.isAlive === false, 'hero1 is dead');
    console.groupEnd();

    // =====================
    // TEST 5 — applyHeal
    // =====================
    console.group('TEST 5 — applyHeal');
    hero2.health = 50; // manually damage hero2 first
    applyHeal('hero-3', 'hero-2');
    console.log('Hero2 HP after heal:', hero2.health);
    console.assert(hero2.health > 50, 'hero2 was healed');
    console.groupEnd();

    // =====================
    // TEST 6 — initMatch & win condition
    // =====================
    console.group('TEST 6 — initMatch + win condition');
    // reset first
    clearCharacters();
    addCharacter('villain', 'villain', 'brute',   mockVillain, 'player-villain');
    addCharacter('hero-1',  'hero',    'tank',     mockHero,    'player-hero-1');
    addCharacter('hero-2',  'hero',    'dps',      mockHero,    'player-hero-2');
    addCharacter('hero-3',  'hero',    'support',  mockHero,    'player-hero-3');
    initMatch('villain', ['hero-1', 'hero-2', 'hero-3']);
    console.assert(getState() === STATES.BATTLE, 'state is BATTLE after initMatch');

    // =====================
    // TEST 7 — cooldowns
    // =====================
    console.group('TEST 7 — cooldowns');
    console.assert(!isOnCooldown('hero-2', 'magic'), 'magic not on cooldown initially');
    performMagic('hero-2', { x: 0, y: 0, z: -1 });
    console.assert(isOnCooldown('hero-2', 'magic'),  'magic on cooldown after cast');
    console.groupEnd();

    // kill all heroes — should trigger villain win
    onMatchOver(({ winner }) => {
      console.log('Match winner:', winner);
      console.assert(winner === 'villain', 'villain wins when all heroes dead');
    });

    handleDeath('hero-1');
    handleDeath('hero-2');
    handleDeath('hero-3');
    console.assert(getState() === STATES.GAME_OVER, 'state is GAME_OVER after all heroes die');
    console.groupEnd();

    console.log('%c ALL TESTS DONE — check for any failed assertions above', 'color: lime; font-size: 16px');
  </script>
</body>
</html>
