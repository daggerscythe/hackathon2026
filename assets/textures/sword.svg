<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 300" width="100" height="300">
  <!-- blade -->
  <polygon points="50,10 42,240 58,240" fill="#c0c0c0" stroke="#888" stroke-width="1"/>
  <!-- blade edge highlight -->
  <polygon points="50,10 50,240 56,240" fill="#e8e8e8" opacity="0.6"/>
  <!-- crossguard -->
  <rect x="20" y="238" width="60" height="14" rx="3" fill="#8B6914" stroke="#5a4008" stroke-width="1"/>
  <!-- grip -->
  <rect x="43" y="252" width="14" height="38" rx="4" fill="#5a2d00" stroke="#3a1a00" stroke-width="1"/>
  <!-- grip wrap lines -->
  <line x1="43" y1="262" x2="57" y2="262" stroke="#8B4513" stroke-width="2"/>
  <line x1="43" y1="272" x2="57" y2="272" stroke="#8B4513" stroke-width="2"/>
  <line x1="43" y1="282" x2="57" y2="282" stroke="#8B4513" stroke-width="2"/>
  <!-- pommel -->
  <ellipse cx="50" cy="292" rx="10" ry="8" fill="#8B6914" stroke="#5a4008" stroke-width="1"/>
  <!-- blade shine -->
  <line x1="50" y1="15" x2="46" y2="200" stroke="white" stroke-width="1.5" opacity="0.4"/>
</svg>
