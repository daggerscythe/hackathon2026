<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="30%"  stop-color="#fff176"/>
      <stop offset="60%"  stop-color="#ff6f00"/>
      <stop offset="100%" stop-color="#bf360c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff6f00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff6f00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- outer glow -->
  <circle cx="100" cy="100" r="95" fill="url(#glow)"/>

  <!-- flame wisps -->
  <ellipse cx="100" cy="55"  rx="18" ry="32" fill="#ff6f00" opacity="0.7" transform="rotate(-20 100 100)"/>
  <ellipse cx="100" cy="55"  rx="14" ry="28" fill="#ff8f00" opacity="0.6" transform="rotate(15 100 100)"/>
  <ellipse cx="100" cy="55"  rx="10" ry="24" fill="#ffa000" opacity="0.5" transform="rotate(40 100 100)"/>
  <ellipse cx="100" cy="55"  rx="8"  ry="20" fill="#ffb300" opacity="0.5" transform="rotate(-40 100 100)"/>

  <!-- core ball -->
  <circle cx="100" cy="100" r="52" fill="url(#core)"/>

  <!-- inner bright spot -->
  <circle cx="88" cy="88" r="16" fill="white" opacity="0.5"/>
</svg>
