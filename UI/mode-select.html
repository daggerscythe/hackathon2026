<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mode Selection</title>
  <link rel="stylesheet" href="menu.css" />
  <link rel="stylesheet" href="mode-select.css" />

  
</head>
<body>
  <div class="mode-container">
    <h1 class="game-title">Select Mode</h1>
    <p class="subtitle">Choose how you want to play</p>

    <div class="mode-grid">
      <div class="mode-card" onclick="selectMode('story')">
        <div class="mode-title">Story Mode</div>
        <div class="mode-description">
          Play through the main game experience with progression and objectives.
        </div>
      </div>

      <div class="mode-card" onclick="selectMode('arcade')">
        <div class="mode-title">Arcade Mode</div>
        <div class="mode-description">
          Jump right into fast-paced gameplay and try to beat your best score.
        </div>
      </div>

      <div class="mode-card" onclick="selectMode('multiplayer')">
        <div class="mode-title">Multiplayer</div>
        <div class="mode-description">
          Compete or cooperate with other players in shared matches.
        </div>
      </div>
    </div>

    <div class="mode-actions">
      <button class="menu-btn secondary" onclick="goBack()">Back</button>
      <button class="menu-btn" onclick="confirmSelection()">Confirm</button>
    </div>

    <p class="footer-text" id="selected-mode-text">No mode selected</p>
  </div>

  <script>
    let selectedMode = null;

    function selectMode(mode) {
      selectedMode = mode;
      const text = document.getElementById("selected-mode-text");
      text.textContent = "Selected Mode: " + mode.charAt(0).toUpperCase() + mode.slice(1);
    }

    function confirmSelection() {
      if (!selectedMode) {
        alert("Please select a mode first.");
        return;
      }
      alert("Starting " + selectedMode + " mode.");
    }

    function goBack() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
