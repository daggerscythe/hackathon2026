<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Your Champion</title>
  <link rel="stylesheet" href="menu.css" />
  <style>

    body {
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      overflow: hidden;
      cursor: default;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Page title strip ──────────────────────────────────────────────── */
    .page-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 32px;
      border-bottom: 1px solid rgba(201,168,76,0.2);
      background: rgba(4,6,12,0.9);
      flex-shrink: 0;
      gap: 18px;
    }

    .header-rule {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4), transparent);
    }

    .page-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold-light);
      text-shadow: 0 0 24px rgba(201,168,76,0.5);
      white-space: nowrap;
    }

    /* ── Main body row ─────────────────────────────────────────────────── */
    .main-row {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      min-height: 0;
      padding: 16px 24px;
      gap: 20px;
    }

    /* ── Character grid ────────────────────────────────────────────────── */
    .grid-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .char-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      flex: 1;
    }

    .char-cell {
      position: relative;
      aspect-ratio: 1;
      border: 1px solid rgba(201,168,76,0.14);
      background: rgba(201,168,76,0.03);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border-color 0.12s, background 0.12s, transform 0.12s;
    }

    /* Inner shine line */
    .char-cell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    }

    .char-cell:hover {
      border-color: rgba(201,168,76,0.5);
      background: rgba(201,168,76,0.08);
      transform: scale(1.06);
      z-index: 3;
    }

    .char-cell.selected {
      border: 2px solid var(--gold);
      background: rgba(201,168,76,0.12);
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.3),
        0 0 16px rgba(201,168,76,0.4),
        inset 0 0 12px rgba(201,168,76,0.08);
      transform: scale(1.08);
      z-index: 4;
    }

    /* Top-edge glow on selected */
    .char-cell.selected::before {
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.6;
    }

    .char-cell .cell-emoji {
      font-size: clamp(1.2rem, 2.2vw, 2rem);
      line-height: 1;
      pointer-events: none;
    }

    .char-cell .cell-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.28rem, 0.55vw, 0.48rem);
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--white-faint);
      margin-top: 3px;
      text-align: center;
      pointer-events: none;
      line-height: 1.1;
    }

    .char-cell.selected .cell-label {
      color: var(--gold-dim);
    }

    /* ── Cursor / highlight frame (Smash-style moving selector) ─────────── */
    #cursor-frame {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      border: 2px solid var(--gold-light);
      box-shadow: 0 0 0 1px rgba(201,168,76,0.3), 0 0 20px rgba(201,168,76,0.6);
      transition: top 0.1s ease, left 0.1s ease, width 0.1s ease, height 0.1s ease;
      display: none;
    }

    /* ── Right panel — selected character info ─────────────────────────── */
    .info-panel {
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Large character preview */
    .preview-box {
      border: 1px solid rgba(201,168,76,0.22);
      background: rgba(201,168,76,0.04);
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      min-height: 160px;
    }

    .preview-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 70% at 50% 60%, rgba(201,168,76,0.07) 0%, transparent 70%);
    }

    /* Top accent line */
    .preview-box::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.5;
    }

    .preview-emoji {
      font-size: 4.5rem;
      line-height: 1;
      filter: drop-shadow(0 0 18px rgba(201,168,76,0.4));
      transition: opacity 0.2s, transform 0.2s;
      position: relative;
      z-index: 1;
    }

    .preview-emoji.switching {
      opacity: 0;
      transform: translateY(8px);
    }

    .preview-name {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-light);
      text-shadow: 0 0 16px rgba(201,168,76,0.4);
      text-align: center;
      position: relative;
      z-index: 1;
      transition: opacity 0.2s;
    }

    .preview-class {
      font-family: 'Cinzel', serif;
      font-size: 0.52rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--white-faint);
      text-align: center;
      position: relative;
      z-index: 1;
      transition: opacity 0.2s;
    }

    /* Stat bars */
    .stat-block {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-name {
      font-family: 'Cinzel', serif;
      font-size: 0.48rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--white-faint);
      width: 44px;
      flex-shrink: 0;
    }

    .stat-track {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.06);
      position: relative;
    }

    .stat-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold-light));
      box-shadow: 0 0 6px rgba(201,168,76,0.4);
      transition: width 0.35s ease;
    }

    /* ── Bottom: player tag + confirm ──────────────────────────────────── */
    .bottom-strip {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      padding: 10px 24px;
      border-top: 1px solid rgba(201,168,76,0.15);
      background: rgba(4,6,12,0.92);
      gap: 20px;
      flex-shrink: 0;
    }

    .player-tag-box {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(201,168,76,0.25);
      padding: 8px 16px;
      background: rgba(201,168,76,0.05);
    }

    .player-tag-label {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 2px;
    }

    .player-tag-name {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--white-dim);
    }

    .bottom-spacer { flex: 1; }

    .bottom-strip .menu-btn {
      width: auto;
      padding: 8px 4px;
      font-size: 0.78rem;
    }

  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <div id="cursor-frame"></div>

  <!-- ── Header ───────────────────────────────────────────────────────── -->
  <div class="page-header">
    <div class="header-rule"></div>
    <h1 class="page-title">Choose Your Champion</h1>
    <div class="header-rule"></div>
  </div>

  <!-- ── Main ─────────────────────────────────────────────────────────── -->
  <div class="main-row">

    <!-- Grid -->
    <div class="grid-wrap">
      <div class="char-grid" id="char-grid"></div>
    </div>

    <!-- Info panel -->
    <div class="info-panel">

      <div class="preview-box">
        <div class="preview-emoji" id="preview-emoji">⚔️</div>
        <div class="preview-name" id="preview-name">Ironclad</div>
        <div class="preview-class" id="preview-class">Warrior · Strength</div>
      </div>

      <div class="stat-block" id="stat-block">
        <!-- injected by JS -->
      </div>

    </div>

  </div>

  <!-- ── Bottom strip ──────────────────────────────────────────────────── -->
  <div class="bottom-strip">
    <div class="player-tag-box">
      <span class="player-tag-label">P1</span>
      <span class="player-tag-name" id="selected-name-tag">Select a champion</span>
    </div>
    <div class="bottom-spacer"></div>
    <button class="menu-btn secondary" onclick="goBack()">← Back</button>
    <button class="menu-btn" id="confirm-btn" onclick="confirmSelection()">Confirm →</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>

    // ── Roster ───────────────────────────────────────────────────────────
    const CHARACTERS = [
      { name:'Ironclad',   cls:'Warrior · Strength',    emoji:'⚔️',  str:90, dex:45, mag:20, def:80, spd:50 },
      { name:'Ashveil',    cls:'Ranger · Precision',    emoji:'🏹',  str:60, dex:95, mag:30, def:40, spd:85 },
      { name:'Mordwyn',    cls:'Sorcerer · Arcane',     emoji:'🔮',  str:25, dex:50, mag:98, def:30, spd:60 },
      { name:'Seraphis',   cls:'Paladin · Holy',        emoji:'🛡️',  str:70, dex:40, mag:65, def:90, spd:40 },
      { name:'Duskbane',   cls:'Assassin · Shadow',     emoji:'🗡️',  str:75, dex:88, mag:40, def:35, spd:95 },
      { name:'Calyx',      cls:'Druid · Nature',        emoji:'🌿',  str:45, dex:60, mag:80, def:55, spd:65 },
      { name:'Thornwall',  cls:'Berserker · Fury',      emoji:'🪓',  str:98, dex:35, mag:10, def:60, spd:70 },
      { name:'Sylvara',    cls:'Witch · Illusion',      emoji:'🌙',  str:30, dex:65, mag:92, def:25, spd:75 },
      { name:'Vaelthorn',  cls:'Knight · Iron',         emoji:'🏰',  str:80, dex:50, mag:15, def:95, spd:35 },
      { name:'Cindra',     cls:'Pyromancer · Flame',    emoji:'🔥',  str:55, dex:55, mag:88, def:35, spd:72 },
      { name:'Erevan',     cls:'Bard · Charm',          emoji:'🎶',  str:40, dex:70, mag:72, def:45, spd:80 },
      { name:'Gromtide',   cls:'Shaman · Storm',        emoji:'⚡',  str:65, dex:58, mag:78, def:50, spd:60 },
      { name:'Nyx',        cls:'Rogue · Venom',         emoji:'🕷️',  str:68, dex:90, mag:45, def:30, spd:92 },
      { name:'Aurelion',   cls:'Mage · Light',          emoji:'✨',  str:20, dex:45, mag:100,def:28, spd:68 },
      { name:'Ragnok',     cls:'Barbarian · Rage',      emoji:'💀',  str:95, dex:40, mag:5,  def:70, spd:55 },
      { name:'Lirien',     cls:'Cleric · Faith',        emoji:'🕊️',  str:38, dex:48, mag:75, def:65, spd:52 },
      { name:'Skareth',    cls:'Necromancer · Death',   emoji:'💀',  str:42, dex:52, mag:90, def:40, spd:58 },
      { name:'Bryndis',    cls:'Valkyrie · Storm',      emoji:'⚔️',  str:82, dex:72, mag:42, def:75, spd:78 },
      { name:'Ozryn',      cls:'Alchemist · Chaos',     emoji:'⚗️',  str:50, dex:60, mag:82, def:45, spd:62 },
      { name:'Ferrox',     cls:'Golem · Earth',         emoji:'🗿',  str:88, dex:20, mag:10, def:99, spd:20 },
    ];

    // Pad to fill a 10-col grid (add locked slots)
    while (CHARACTERS.length % 10 !== 0) {
      CHARACTERS.push({ name:'???', cls:'', emoji:'🔒', str:0, dex:0, mag:0, def:0, spd:0, locked:true });
    }

    let selectedIdx = null;

    // ── Build grid ───────────────────────────────────────────────────────
    const grid = document.getElementById('char-grid');

    CHARACTERS.forEach((c, i) => {
      const cell = document.createElement('div');
      cell.className = 'char-cell' + (c.locked ? ' locked' : '');
      cell.dataset.idx = i;
      cell.innerHTML = `
        <span class="cell-emoji">${c.emoji}</span>
        <span class="cell-label">${c.locked ? '???' : c.name}</span>
      `;
      if (!c.locked) {
        cell.addEventListener('click', () => selectCharacter(i));
        cell.addEventListener('mouseenter', () => previewCharacter(i));
      }
      cell.style.opacity = c.locked ? '0.3' : '1';
      grid.appendChild(cell);
    });

    // ── Preview on hover ─────────────────────────────────────────────────
    function previewCharacter(idx) {
      const c = CHARACTERS[idx];
      setPreview(c);
    }

    // ── Select on click ──────────────────────────────────────────────────
    function selectCharacter(idx) {
      if (CHARACTERS[idx].locked) return;

      // Deselect previous
      if (selectedIdx !== null) {
        document.querySelector(`[data-idx="${selectedIdx}"]`)?.classList.remove('selected');
      }
      selectedIdx = idx;
      document.querySelector(`[data-idx="${idx}"]`).classList.add('selected');

      const c = CHARACTERS[idx];
      setPreview(c);
      document.getElementById('selected-name-tag').textContent = c.name;
    }

    function setPreview(c) {
      const emojiEl = document.getElementById('preview-emoji');
      const nameEl  = document.getElementById('preview-name');
      const clsEl   = document.getElementById('preview-class');

      emojiEl.classList.add('switching');
      setTimeout(() => {
        emojiEl.textContent = c.emoji;
        nameEl.textContent  = c.name;
        clsEl.textContent   = c.cls;
        emojiEl.classList.remove('switching');
      }, 180);

      // Stats
      const stats = [
        { label: 'STR', val: c.str },
        { label: 'DEX', val: c.dex },
        { label: 'MAG', val: c.mag },
        { label: 'DEF', val: c.def },
        { label: 'SPD', val: c.spd },
      ];
      const block = document.getElementById('stat-block');
      block.innerHTML = stats.map(s => `
        <div class="stat-row">
          <span class="stat-name">${s.label}</span>
          <div class="stat-track">
            <div class="stat-fill" style="width:${s.val}%"></div>
          </div>
        </div>
      `).join('');
    }

    // Initialise preview with first character
    setPreview(CHARACTERS[0]);

    // ── Three.js background ──────────────────────────────────────────────
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);
    camera.position.set(0, 0, 14);

    const wireFaint = new THREE.MeshBasicMaterial({ color: 0xc9a84c, wireframe: true, transparent: true, opacity: 0.055 });

    const floaters = [];
    for (let i = 0; i < 8; i++) {
      const geo = new THREE.PlaneGeometry(3+Math.random()*7, 2+Math.random()*6, Math.floor(3+Math.random()*5), Math.floor(3+Math.random()*5));
      const mesh = new THREE.Mesh(geo, wireFaint);
      mesh.position.set((Math.random()-0.5)*28, (Math.random()-0.5)*18, -10-Math.random()*14);
      mesh.rotation.set((Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5, Math.random()*Math.PI);
      mesh.userData.axis = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
      mesh.userData.speed = 0.0004 + Math.random()*0.0008;
      scene.add(mesh); floaters.push(mesh);
    }

    function animate() {
      requestAnimationFrame(animate);
      for (const f of floaters) f.rotateOnAxis(f.userData.axis, f.userData.speed);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Nav ──────────────────────────────────────────────────────────────
    function confirmSelection() {
      if (selectedIdx === null) { alert('Choose a champion first.'); return; }
      alert(`Champion chosen: ${CHARACTERS[selectedIdx].name}\n\nThe adventure begins…`);
    }
    function goBack() { window.location.href = 'mode-select.html'; }

  </script>
</body>
</html>
