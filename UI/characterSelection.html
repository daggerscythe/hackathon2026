<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Your Champion</title>
  <link rel="stylesheet" href="menu.css" />
  <style>

    body {
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      overflow: hidden;
      cursor: default;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Page title strip ──────────────────────────────────────────────── */
    .page-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 32px;
      border-bottom: 1px solid rgba(201,168,76,0.2);
      background: rgba(4,6,12,0.9);
      flex-shrink: 0;
      gap: 18px;
    }

    .header-rule {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4), transparent);
    }

    .page-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold-light);
      text-shadow: 0 0 24px rgba(201,168,76,0.5);
      white-space: nowrap;
    }

    /* ── Main body row ─────────────────────────────────────────────────── */
    .main-row {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      min-height: 0;
      padding: 16px 24px;
      gap: 20px;
    }

    /* ── Character grid ────────────────────────────────────────────────── */
    .grid-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .char-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      flex: 1;
    }

    .char-cell {
      position: relative;
      aspect-ratio: 1;
      border: 1px solid rgba(201,168,76,0.14);
      background: rgba(201,168,76,0.03);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border-color 0.12s, background 0.12s, transform 0.12s;
    }

    /* Inner shine line */
    .char-cell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    }

    .char-cell:hover {
      border-color: rgba(201,168,76,0.5);
      background: rgba(201,168,76,0.08);
      transform: scale(1.06);
      z-index: 3;
    }

    .char-cell.selected {
      border: 2px solid var(--gold);
      background: rgba(201,168,76,0.12);
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.3),
        0 0 16px rgba(201,168,76,0.4),
        inset 0 0 12px rgba(201,168,76,0.08);
      transform: scale(1.08);
      z-index: 4;
    }

    /* Top-edge glow on selected */
    .char-cell.selected::before {
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.6;
    }

    .char-cell .cell-emoji {
      font-size: clamp(1.2rem, 2.2vw, 2rem);
      line-height: 1;
      pointer-events: none;
    }

    .char-cell .cell-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.28rem, 0.55vw, 0.48rem);
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--white-faint);
      margin-top: 3px;
      text-align: center;
      pointer-events: none;
      line-height: 1.1;
    }

    .char-cell.selected .cell-label {
      color: var(--gold-dim);
    }

    /* ── Cursor / highlight frame (Smash-style moving selector) ─────────── */
    #cursor-frame {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      border: 2px solid var(--gold-light);
      box-shadow: 0 0 0 1px rgba(201,168,76,0.3), 0 0 20px rgba(201,168,76,0.6);
      transition: top 0.1s ease, left 0.1s ease, width 0.1s ease, height 0.1s ease;
      display: none;
    }

    /* ── Right panel — selected character info ─────────────────────────── */
    .info-panel {
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Large character preview */
    .preview-box {
      border: 1px solid rgba(201,168,76,0.22);
      background: rgba(201,168,76,0.04);
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      min-height: 160px;
    }

    .preview-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 70% at 50% 60%, rgba(201,168,76,0.07) 0%, transparent 70%);
    }

    /* Top accent line */
    .preview-box::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.5;
    }

    .preview-emoji {
      font-size: 4.5rem;
      line-height: 1;
      filter: drop-shadow(0 0 18px rgba(201,168,76,0.4));
      transition: opacity 0.2s, transform 0.2s;
      position: relative;
      z-index: 1;
    }

    .preview-emoji.switching {
      opacity: 0;
      transform: translateY(8px);
    }

    .preview-name {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-light);
      text-shadow: 0 0 16px rgba(201,168,76,0.4);
      text-align: center;
      position: relative;
      z-index: 1;
      transition: opacity 0.2s;
    }

    .preview-class {
      font-family: 'Cinzel', serif;
      font-size: 0.52rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--white-faint);
      text-align: center;
      position: relative;
      z-index: 1;
      transition: opacity 0.2s;
    }

    /* Stat bars */
    .stat-block {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-name {
      font-family: 'Cinzel', serif;
      font-size: 0.48rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--white-faint);
      width: 44px;
      flex-shrink: 0;
    }

    .stat-track {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.06);
      position: relative;
    }

    .stat-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold-light));
      box-shadow: 0 0 6px rgba(201,168,76,0.4);
      transition: width 0.35s ease;
    }

    /* ── Bottom: player tag + confirm ──────────────────────────────────── */
    .bottom-strip {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      padding: 10px 24px;
      border-top: 1px solid rgba(201,168,76,0.15);
      background: rgba(4,6,12,0.92);
      gap: 20px;
      flex-shrink: 0;
    }

    .player-tag-box {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(201,168,76,0.25);
      padding: 8px 16px;
      background: rgba(201,168,76,0.05);
    }

    .player-tag-label {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 2px;
    }

    .player-tag-name {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--white-dim);
    }

    .bottom-spacer { flex: 1; }

    .bottom-strip .menu-btn {
      width: auto;
      padding: 8px 4px;
      font-size: 0.78rem;
    }

  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <div id="cursor-frame"></div>

  <!-- ── Header ───────────────────────────────────────────────────────── -->
  <div class="page-header">
    <div class="header-rule"></div>
    <h1 class="page-title">Choose Your Champion</h1>
    <div class="header-rule"></div>
  </div>

  <!-- ── Main ─────────────────────────────────────────────────────────── -->
  <div class="main-row">

    <!-- Grid -->
    <div class="grid-wrap">
      <div class="char-grid" id="char-grid"></div>
    </div>

    <!-- Info panel -->
    <div class="info-panel">

      <div class="preview-box">
        <div class="preview-emoji" id="preview-emoji">⚔️</div>
        <div class="preview-name" id="preview-name">Ironclad</div>
        <div class="preview-class" id="preview-class">Warrior · Strength</div>
      </div>

      <div class="stat-block" id="stat-block">
        <!-- injected by JS -->
      </div>

    </div>

  </div>

  <!-- ── Bottom strip ──────────────────────────────────────────────────── -->
  <div class="bottom-strip">
    <div class="player-tag-box">
      <span class="player-tag-label">P1</span>
      <span class="player-tag-name" id="selected-name-tag">Select a champion</span>
    </div>
    <div class="bottom-spacer"></div>
    <button class="menu-btn secondary" onclick="goBack()">← Back</button>
    <button class="menu-btn" id="confirm-btn" onclick="confirmSelection()">Confirm →</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ── CSV → CHARACTERS → Grid ──────────────────────────────────────────
let CHARACTERS = [];
let selectedIdx = null;

function csvToJson(csvString) {
  const rows    = csvString.split("\n");
  const headers = rows[0].split(",").map(h => h.trim());
  const result  = [];

  for (let i = 1; i < rows.length; i++) {
    if (!rows[i].trim()) continue;
    const values = rows[i].split(",");
    const obj    = {};
    for (let j = 0; j < headers.length; j++) {
      obj[headers[j]] = values[j]?.trim() ?? '';
    }
    result.push(obj);
  }
  return result;
}

function buildGrid() {
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';

  CHARACTERS.forEach((c, i) => {
    const cell = document.createElement('div');
    cell.className = 'char-cell' + (c.locked ? ' locked' : '');
    cell.dataset.idx = i;
    cell.innerHTML = `
      <span class="cell-emoji">${c.emoji}</span>
      <span class="cell-label">${c.locked ? '???' : c.name}</span>
    `;
    if (!c.locked) {
      cell.addEventListener('click',      () => selectCharacter(i));
      cell.addEventListener('mouseenter', () => previewCharacter(i));
    }
    cell.style.opacity = c.locked ? '0.3' : '1';
    grid.appendChild(cell);
  });
}

// ── Read which side was chosen in the lobby ──────────────────────────
const chosenSide = sessionStorage.getItem('characterSide') || 'Hero';
const isVillainSide = chosenSide === 'Villain';

// Update the page title to reflect the side
document.querySelector('.page-title').textContent =
  isVillainSide ? 'Choose Your Villain' : 'Choose Your Champion';

// ── Role criteria differ by side ─────────────────────────────────────
// Heroes: Tank / DPS / Support / Mage  (original thresholds)
// Villains: Brute / Destroyer / Schemer / Sorcerer  (same stat thresholds, new labels)
const ROLES = isVillainSide
  ? [
      { cls: 'Brute',     test: c => c.def >= 70 && c.spd <= 50,              criteria: 'DEF ≥ 70  &  SPD ≤ 50' },
      { cls: 'Destroyer', test: c => c.str >= 80 && c.def <= 60,              criteria: 'STR ≥ 80  &  DEF ≤ 60' },
      { cls: 'Schemer',   test: c => c.pow >= 70 && c.str <= 20 && c.def <= 20, criteria: 'POW ≥ 70  &  STR ≤ 20  &  DEF ≤ 20' },
      { cls: 'Sorcerer',  test: c => c.mag >= 80 && c.def <= 40,              criteria: 'MAG ≥ 80  &  DEF ≤ 40' },
    ]
  : [
      { cls: 'Tank',    test: c => c.def >= 70 && c.spd <= 50,              criteria: 'DEF ≥ 70  &  SPD ≤ 50' },
      { cls: 'DPS',     test: c => c.str >= 80 && c.def <= 60,              criteria: 'STR ≥ 80  &  DEF ≤ 60' },
      { cls: 'Support', test: c => c.pow >= 70 && c.str <= 20 && c.def <= 20, criteria: 'POW ≥ 70  &  STR ≤ 20  &  DEF ≤ 20' },
      { cls: 'Mage',    test: c => c.mag >= 80 && c.def <= 40,              criteria: 'MAG ≥ 80  &  DEF ≤ 40' },
    ];

function classifyCharacter(c) {
  for (const role of ROLES) {
    if (role.test(c)) return role.cls;
  }
  return null;
}

// ── Inject criteria legend below the grid ────────────────────────────
function buildCriteriaLegend() {
  let legend = document.getElementById('criteria-legend');
  if (!legend) {
    legend = document.createElement('div');
    legend.id = 'criteria-legend';
    legend.style.cssText = `
      font-family:'Cinzel',serif; font-size:0.48rem; letter-spacing:2px;
      text-transform:uppercase; color:var(--white-faint);
      display:flex; flex-wrap:wrap; gap:10px 24px; margin-top:6px;
    `;
    document.querySelector('.grid-wrap').appendChild(legend);
  }
  legend.innerHTML = ROLES.map(r =>
    `<span><span style="color:var(--gold-dim)">${r.cls}</span> — ${r.criteria}</span>`
  ).join('');
}

fetch('../data.csv')
  .then(r => r.text())
  .then(content => {
    const raw = csvToJson(content);

    // Filter to the correct side
    const sideFilter = isVillainSide ? 'True' : 'False';

    CHARACTERS = raw
      .filter(obj => obj.isVillain === sideFilter)
      .map(obj => {
        const str = +obj.Strength      || 0;
        const def = +obj.Defense       || 0;
        const mag = +obj.Magic         || 0;
        const spd = +obj.Speed         || 0;
        const pow = +obj.Power         || 0;
        const dex = +obj.Intelligence  || 0;

        const cls = classifyCharacter({ str, def, mag, spd, pow, dex });
        if (!cls) return null;  // skip unclassified

        const emoji = isVillainSide ? '💀' : '⚔️';
        return { name: obj.Name, cls, emoji, str, dex, mag, def, spd, pow };
      })
      .filter(Boolean)
      .slice(0, 50);

    // Pad to fill a 10-col grid
    while (CHARACTERS.length % 10 !== 0) {
      CHARACTERS.push({ name:'???', cls:'', emoji:'🔒', str:0, dex:0, mag:0, def:0, spd:0, pow:0, locked:true });
    }

    console.log(`${chosenSide} characters loaded:`, CHARACTERS.filter(c => !c.locked).map(c => `${c.name} (${c.cls})`));

    buildGrid();
    buildCriteriaLegend();
    if (CHARACTERS.length > 0) setPreview(CHARACTERS[0]);
  })
  .catch(err => console.error('Failed to load data.csv:', err));

// ── Preview on hover ──────────────────────────────────────────────────
function previewCharacter(idx) {
  setPreview(CHARACTERS[idx]);
}

// ── Select on click ───────────────────────────────────────────────────
function selectCharacter(idx) {
  if (CHARACTERS[idx].locked) return;

  if (selectedIdx !== null) {
    document.querySelector(`[data-idx="${selectedIdx}"]`)?.classList.remove('selected');
  }
  selectedIdx = idx;
  document.querySelector(`[data-idx="${idx}"]`).classList.add('selected');

  const c = CHARACTERS[idx];
  setPreview(c);
  document.getElementById('selected-name-tag').textContent = c.name;
}

function setPreview(c) {
  const emojiEl = document.getElementById('preview-emoji');
  const nameEl  = document.getElementById('preview-name');
  const clsEl   = document.getElementById('preview-class');

  emojiEl.classList.add('switching');
  setTimeout(() => {
    emojiEl.textContent = c.emoji;
    nameEl.textContent  = c.name;
    clsEl.textContent   = c.cls;
    emojiEl.classList.remove('switching');
  }, 180);

  const stats = [
    { label: 'STR', val: c.str },
    { label: 'DEX', val: c.dex },
    { label: 'MAG', val: c.mag },
    { label: 'DEF', val: c.def },
    { label: 'SPD', val: c.spd },
  ];
  const block = document.getElementById('stat-block');
  block.innerHTML = stats.map(s => `
    <div class="stat-row">
      <span class="stat-name">${s.label}</span>
      <div class="stat-track">
        <div class="stat-fill" style="width:${s.val}%"></div>
      </div>
    </div>
  `).join('');
}

// ── Three.js background ───────────────────────────────────────────────
const canvas   = document.getElementById('bg-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 14);

const wireFaint = new THREE.MeshBasicMaterial({ color: 0xc9a84c, wireframe: true, transparent: true, opacity: 0.055 });

const floaters = [];
for (let i = 0; i < 8; i++) {
  const geo  = new THREE.PlaneGeometry(3+Math.random()*7, 2+Math.random()*6, Math.floor(3+Math.random()*5), Math.floor(3+Math.random()*5));
  const mesh = new THREE.Mesh(geo, wireFaint);
  mesh.position.set((Math.random()-0.5)*28, (Math.random()-0.5)*18, -10-Math.random()*14);
  mesh.rotation.set((Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5, Math.random()*Math.PI);
  mesh.userData.axis  = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
  mesh.userData.speed = 0.0004 + Math.random()*0.0008;
  scene.add(mesh);
  floaters.push(mesh);
}

function animate() {
  requestAnimationFrame(animate);
  for (const f of floaters) f.rotateOnAxis(f.userData.axis, f.userData.speed);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Nav ───────────────────────────────────────────────────────────────
function confirmSelection() {
  if (selectedIdx === null) { alert('Choose a champion first.'); return; }
  const chosen = CHARACTERS[selectedIdx];
  sessionStorage.setItem('selectedCharacter', chosen.name);
  sessionStorage.setItem('selectedClass', chosen.cls);
  // For now navigate back — swap for actual game page once ready
}
function goBack() { window.location.href = 'mode-select.html'; }
  


  </script>
</body>
</html>
