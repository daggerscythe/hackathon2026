<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="menu.css" />
  <title>Game Menu</title>
  <style>
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .menu-container {
      position: relative;
      z-index: 1;
    }
  </style>

  <script src="../game/audio.js"></script>
  <script src="../game/consistent_audio.js"></script>

</head>
<body>
  
  <canvas id="bg-canvas"></canvas>

  <div class="menu-container">
    <h1 class="game-title">Slaying Goliath</h1>
    <p class="subtitle">A Hackathon Project &nbsp;·&nbsp; OleMiss CS</p>

    <div class="button-group">
      <button class="menu-btn" onclick="startGame()">Start Game</button>
    </div>

    <p class="footer-text">Press a button to continue</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    document.addEventListener('click', tryStartTheme, { once: true });
    document.addEventListener('keydown', tryStartTheme, { once: true });

    // ── Scene setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 0, 14);

    // ── Wireframe materials ──────────────────────────────────────────────────
    const wireBright = new THREE.MeshBasicMaterial({
      color: 0xc9a84c, wireframe: true, transparent: true, opacity: 0.22
    });
    const wireMid = new THREE.MeshBasicMaterial({
      color: 0xd4b86a, wireframe: true, transparent: true, opacity: 0.13
    });
    const wireFaint = new THREE.MeshBasicMaterial({
      color: 0xe8d090, wireframe: true, transparent: true, opacity: 0.07
    });

    // ── SWORD group ──────────────────────────────────────────────────────────
    const swordGroup = new THREE.Group();

    // Blade — tapered 4-sided prism, subdivided so wireframe shows nice lines
    const bladeGeo = new THREE.CylinderGeometry(0.03, 0.16, 5.8, 4, 12);
    const blade = new THREE.Mesh(bladeGeo, wireBright);
    blade.rotation.y = Math.PI / 4;
    swordGroup.add(blade);

    // Crossguard
    const guardGeo = new THREE.BoxGeometry(2.8, 0.13, 0.22, 6, 2, 2);
    swordGroup.add(new THREE.Mesh(guardGeo, wireBright)).position.y = -2.9;

    // Grip
    const gripGeo = new THREE.CylinderGeometry(0.09, 0.12, 1.2, 6, 5);
    const grip = new THREE.Mesh(gripGeo, wireMid);
    grip.position.y = -3.75;
    swordGroup.add(grip);

    // Pommel
    const pommelGeo = new THREE.SphereGeometry(0.28, 7, 5);
    const pommel = new THREE.Mesh(pommelGeo, wireBright);
    pommel.position.y = -4.45;
    swordGroup.add(pommel);

    swordGroup.position.set(4.2, 0.5, -1.5);
    swordGroup.rotation.z = 0.15;
    scene.add(swordGroup);

    // ── SHIELD group ─────────────────────────────────────────────────────────
    const shieldGroup = new THREE.Group();

    // Shield face — flattened sphere hemisphere
    const faceGeo = new THREE.SphereGeometry(2.3, 12, 9, 0, Math.PI * 2, 0, Math.PI * 0.52);
    const face = new THREE.Mesh(faceGeo, wireFaint);
    face.scale.set(1, 1.3, 0.18);
    shieldGroup.add(face);

    // Outer rim
    const rimGeo = new THREE.TorusGeometry(2.25, 0.07, 5, 32, Math.PI * 1.72);
    const rim = new THREE.Mesh(rimGeo, wireBright);
    rim.rotation.x = Math.PI * 0.5;
    shieldGroup.add(rim);

    // Cross emblem on shield
    shieldGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.13, 1.7, 0.06, 1, 5, 1), wireMid));
    shieldGroup.add(new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.13, 0.06, 5, 1, 1), wireMid));

    // Center boss
    const bossGeo = new THREE.SphereGeometry(0.3, 7, 6);
    shieldGroup.add(new THREE.Mesh(bossGeo, wireBright));

    // Inner structural rings (AC-style internal geometry detail)
    for (let r = 0.6; r < 2.1; r += 0.7) {
      const ringGeo = new THREE.TorusGeometry(r, 0.03, 3, 20);
      const ring = new THREE.Mesh(ringGeo, wireFaint);
      ring.rotation.x = Math.PI * 0.5;
      shieldGroup.add(ring);
    }

    shieldGroup.position.set(5.8, -0.8, -4.5);
    scene.add(shieldGroup);

    // ── Drifting background planes (Animus-style) ────────────────────────────
    const floaters = [];
    for (let i = 0; i < 7; i++) {
      const w = 3 + Math.random() * 6;
      const h = 2 + Math.random() * 5;
      const segs = Math.floor(3 + Math.random() * 5);
      const geo = new THREE.PlaneGeometry(w, h, segs, segs);
      const mesh = new THREE.Mesh(geo, wireFaint);
      mesh.position.set(
        (Math.random() - 0.5) * 24,
        (Math.random() - 0.5) * 16,
        -9 - Math.random() * 12
      );
      mesh.rotation.set(
        (Math.random() - 0.5) * 1.5,
        (Math.random() - 0.5) * 1.5,
        Math.random() * Math.PI
      );
      mesh.userData.axis = new THREE.Vector3(
        Math.random() - 0.5,
        Math.random() - 0.5,
        Math.random() - 0.5
      ).normalize();
      mesh.userData.speed = 0.0006 + Math.random() * 0.001;
      scene.add(mesh);
      floaters.push(mesh);
    }

    // ── Animate ──────────────────────────────────────────────────────────────
    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.008;

      // Sword rotates slowly around Y, gentle vertical drift
      swordGroup.rotation.y = t * 0.25;
      swordGroup.position.y = 0.5 + Math.sin(t * 0.55) * 0.32;

      // Shield tilts on multiple axes, counter-phase to sword
      shieldGroup.rotation.y = -t * 0.17;
      shieldGroup.rotation.x = Math.sin(t * 0.38) * 0.14;
      shieldGroup.position.y = -0.8 + Math.cos(t * 0.55) * 0.28;

      // Background floaters drift
      for (const f of floaters) {
        f.rotateOnAxis(f.userData.axis, f.userData.speed);
      }

      renderer.render(scene, camera);
    }
    animate();

    // ── Resize ───────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Game functions ───────────────────────────────────────────────────────
    function startGame()    { 
    window.location.href = "mode-select.html"; 
    
    }
  </script>
</body>
</html>
